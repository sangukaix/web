<!DOCTYPE html>
<html lang="ko">
<head>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>연습문제 1</title>
	<style>	
		#container {
			display: inline-block;
			margin:30px auto;
			border: 3px solid gray;
			border-radius: 180px;

			display: block;
		}

	<img src="images/bear.jpg" alt="곰인형 사진">
</div>
</body>
