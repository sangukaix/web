<!DOCTYPE html> 
<html>
    <head> 
        <meta charset="utf-8"> 
        <title>2</title> 

        <style>
            h1 {background-color: black; color: white; font-size: 1.5em; padding: 3px; margin: 0;}
            h2, p{text-align: center}
            h2{color: #ff0000; font-size: 1.5em;}
            img{width: 100%; height: 200px; object-fit: cover;}
            .accent{color: #0000ff;}
            p{font-size: 1.2em; line-height: 2em; font-weight: bold; text-align: center;}
            #last{font-size: 0.6em;}
            .box{border: 1px solid gray; width: 500px;}
            .section{border-top: 1px solid grey}
        </style>


    </head>
    <body>
        <div class="box">
        <img src="./image/apple.jpg" alt="apple">
        <h1>확인하세요</h1>
        
        <div class="section">
        <h2>주문 및 배송</h2>
        <p><span class="accent">오후 2시 이전</span> 주문건은 당일 발송합니다<br>
            2시 이후 주문건은 다음날 발송합니다(주말 제외)
        </p>
        </div>

        <div class="section">
        <h2>교환 및 환불</h2>
        <p>불만족시 <span class="accent">100%환불</span>해 드립니다<br>
        고객센터로 전화주세요</p>
        </div>

        <div class="section">
        <h2>고객센터</h2>
        <p>0000-0000<br>
        <span id="last">오전9시 - 오후 6시 (토/일, 공휴일 휴무)</span></p>
        </div>
        </div>
    </body>

</html>
