<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>ex</title>
        <!-- 내부 스타일 시트 -->
        <style>
            /* 원하는 의사선택자만을 써도 되지만 순서는 아래 이 순선대로 해야 함. */
            #aa:link{color: blue} /* 링크가 있다면 파란색 */
            #aa:visited{color: green} /*방문한적이 있다면*/
            #aa:hover{color: red; font-size: 2.0em;}
            #aa:active{color: yellow;}

            p:hover{background-color: green;} /*p요소 찾아 그리고 초록색*/
            img{width: 100px; border: 3px solid black}
            img:hover{width: 150px; border: 5px solid lawngreen}

            /* 리스트 스타일 */
            ul{list-style: circle;}
            ul{list-style: disc;} /*default*/
            ul{list-style: square}

            /* 이미지로 불릿기호를 대체하는 방식은 잘 사용안함. 사이즈 문제나 꾸밈이 어려움 */
            /* ul{list-style-image: url('../Day01/image/paris.jpg');} */
            ul{list-style-type: disc; list-style-position: inside;} /*원래는 타입까지 쓰는게 정석인데 위같이 줄여써도됨*/
            ul{list-style: none;}

            ol{list-style-type: lower-alpha;}
            ol{list-style-type: lower-latin;}
            ol{list-style-type: lower-roman;}
            ol{list-style-type: lower-greek;}
            ol{list-style-type: upper-alpha;}
            ol{list-style-type: decimal;} /*default*/
            ol{list-style-type: decimal-leading-zero;}
            
            



        </style>

    </head>
    <body>
        
        <a href="https://www.daum.net" id="aa">다음 포털</a>
        <p>Hello</p>
        <img src="../Day01/image/newyork.jpg" alt="newyork">

        <hr>

        <ul>
            <li>aaa</li>
            <li>bbb</li>
            <li>ccc</li>

        </ul>

        <ol>
            <li>aaa</li>
            <li>bbb</li>
            <li>ccc</li>
        </ol>


    </body>
</html>
